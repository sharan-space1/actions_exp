name: Sandbox Protection

on:
  push:
    branches:
      - sandbox-tmp

jobs:
  enforce-merge-policy:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: "Validate push policy"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHER: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          REPO: ${{ github.repository }}
        run: |

          # ════════════════════════════════════════════════════════
          # FUNCTION: check_direct_push
          # Used for:
          #   - Direct commits (1 parent)
          #   - Local git merges with no associated PR (2 parents, no PR)
          #   - Local git merges where PR exists but was not merged via GitHub UI
          # Validates: allowed list + Type: conflict-resolve trailer
          # ════════════════════════════════════════════════════════
          check_direct_push() {
            # All lowercase — PUSHER is also lowercased before compare
            ALLOWED_USERS=("stillsomehowsane" "sharan-space1" "sarath8096" "tilak1924" "deepak-asint" "bharatramawat28" "pruthvi-hm")

            echo "Pusher   : $PUSHER"
            echo "Commit   : $COMMIT_SHA"
            echo "Message  : $COMMIT_MESSAGE"

            # ── 1. Check if pusher is in the allowed list (case-insensitive) ──
            PUSHER_LOWER=$(echo "$PUSHER" | tr '[:upper:]' '[:lower:]')
            IS_ALLOWED=false
            for user in "${ALLOWED_USERS[@]}"; do
              if [ "$PUSHER_LOWER" == "$user" ]; then
                IS_ALLOWED=true
                break
              fi
            done

            # ── 2. Check for commit trailer: Type: conflict-resolve ──
            TRAILER_VALUE=$(git log -1 --format='%(trailers:key=Type,valueonly)' | tr '[:upper:]' '[:lower:]' | xargs)
            echo "Trailer Type: '$TRAILER_VALUE'"

            HAS_TRAILER=false
            if [ "$TRAILER_VALUE" == "conflict-resolve" ]; then
              HAS_TRAILER=true
            fi

            echo "Is allowed user  : $IS_ALLOWED"
            echo "Has valid trailer: $HAS_TRAILER"

            # ── 3. If EITHER check fails → violation ──
            if [ "$IS_ALLOWED" == "false" ] || [ "$HAS_TRAILER" == "false" ]; then
              echo ""
              echo "  MERGE VIOLATION"
              echo "  ─────────────────────────────────────────────────────"
              echo "  A direct commit was pushed to 'sandbox-tmp' that violates policy."
              echo ""
              echo "  Committed by : $PUSHER"
              echo "  Commit SHA   : $COMMIT_SHA"
              echo "  Timestamp    : $COMMIT_TIMESTAMP"
              echo "  Message      : $COMMIT_MESSAGE"
              echo "  URL          : $COMMIT_URL"
              echo "  ─────────────────────────────────────────────────────"
              echo ""

              if [ "$IS_ALLOWED" == "false" ]; then
                echo "  ✗ '$PUSHER' is not permitted to push directly to sandbox-tmp."
                echo "    Please raise a Pull Request with at least 1 reviewer approval."

              elif [ "$HAS_TRAILER" == "false" ]; then
                echo "  ✗ Direct pushes to sandbox-tmp are only permitted for resolving merge conflicts."
                echo "    Your commit must include the trailer below to confirm this is a conflict resolution."
                echo ""
                echo "      Type: conflict-resolve"
                echo ""
                echo "    Example commit message:"
                echo ""
                echo "      Merge branch 'feature/your-branch' into sandbox-tmp"
                echo ""
                echo "      Type: conflict-resolve"
                echo ""
                echo "    Note: A blank line between the message and the trailer is required."
                echo ""
                echo "    If this is not a conflict resolution, please raise a Pull Request"
                echo "    with at least 1 reviewer approval instead."
              fi

              echo ""
              exit 1
            fi

            echo "✅ Direct push by '$PUSHER' with valid trailer. Policy satisfied."
          }

          # ════════════════════════════════════════════════════════
          # MAIN LOGIC
          #
          # 1 parent                              → direct commit       → check allowed list + trailer
          # 2 parents + no PR found               → local git merge     → check allowed list + trailer
          # 2 parents + PR found
          #     + merge_commit_sha == COMMIT_SHA  → GitHub UI PR merge  → check approvals
          #     + merge_commit_sha != COMMIT_SHA  → local git merge     → check allowed list + trailer
          # ════════════════════════════════════════════════════════

          PARENTS=$(git log -1 --format="%P" | wc -w)
          echo "Parent commit count: $PARENTS"

          if [ "$PARENTS" -gt 1 ]; then

            # Try to find an associated PR for this merge commit
            # Headers required for commits/pulls endpoint to work correctly
            PR_NUMBER=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              repos/$REPO/commits/$COMMIT_SHA/pulls \
              --jq '.[0].number')

            echo "PR Number from API: $PR_NUMBER"

            if [ ! -z "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then

              # Fetch PR details
              PR_DETAILS=$(gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                repos/$REPO/pulls/$PR_NUMBER)

              PR_AUTHOR=$(echo "$PR_DETAILS"         | jq -r '.user.login')
              PR_TITLE=$(echo "$PR_DETAILS"           | jq -r '.title')
              PR_URL=$(echo "$PR_DETAILS"             | jq -r '.html_url')
              PR_LABELS=$(echo "$PR_DETAILS"          | jq -r '[.labels[].name] | @json')
              PR_MERGE_COMMIT=$(echo "$PR_DETAILS"    | jq -r '.merge_commit_sha')

              echo "PR Author        : $PR_AUTHOR"
              echo "PR Title         : $PR_TITLE"
              echo "PR Merge Commit  : $PR_MERGE_COMMIT"

              # ── Compare merge_commit_sha with current COMMIT_SHA ──
              # GitHub sets merge_commit_sha server-side only when merged via UI
              # Local git merge will never match this SHA
              if [ "$PR_MERGE_COMMIT" == "$COMMIT_SHA" ]; then

                # ════════════════════════════════════════════════
                # GITHUB UI PR MERGE — Check at least 1 approved reviewer
                # ════════════════════════════════════════════════

                echo "Detected: GitHub UI PR merge"
                echo "PR Number: #$PR_NUMBER"

                # ── Skip if PR has the 'auto-merge' label ──
                if echo "$PR_LABELS" | grep -qi "auto-merge"; then
                  echo "⏭️  Skipping policy check — PR #$PR_NUMBER has the 'auto-merge' label."
                  exit 0
                fi

                # ── Check for at least 1 approval ──
                APPROVALS=$(gh api \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  repos/$REPO/pulls/$PR_NUMBER/reviews \
                  --jq '[.[] | select(.state == "APPROVED")] | length')

                echo "Approval count: $APPROVALS"

                if [ "$APPROVALS" -lt 1 ]; then
                  echo ""
                  echo "  MERGE VIOLATION"
                  echo "  ─────────────────────────────────────────────────────"
                  echo "  This PR was merged into 'sandbox-tmp' without any reviewer approval."
                  echo ""
                  echo "  Author   : $PR_AUTHOR"
                  echo "  PR       : #$PR_NUMBER — $PR_TITLE"
                  echo "  URL      : $PR_URL"
                  echo "  Commit   : $COMMIT_SHA"
                  echo "  ─────────────────────────────────────────────────────"
                  echo ""
                  echo "  ✗ At least 1 approved review is required before merging into sandbox-tmp."
                  echo ""
                  exit 1
                fi

                echo "✅ PR #$PR_NUMBER has $APPROVALS approval(s). Policy satisfied."

              else

                # ════════════════════════════════════════════════
                # LOCAL GIT MERGE — PR exists but this commit is
                # not the GitHub UI merge commit
                # ════════════════════════════════════════════════

                echo "Detected: Local git merge (PR #$PR_NUMBER exists but not merged via GitHub UI)"
                check_direct_push

              fi

            else

              # ════════════════════════════════════════════════
              # LOCAL GIT MERGE — no PR associated at all
              # ════════════════════════════════════════════════

              echo "Detected: Local git merge (no associated PR)"
              check_direct_push

            fi

          else

            # ════════════════════════════════════════════════
            # DIRECT COMMIT — single parent, no merge
            # ════════════════════════════════════════════════

            echo "Detected: Direct push commit"
            check_direct_push

          fi