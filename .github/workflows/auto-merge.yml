name: Create PR from dev to main

on:
  push:
    branches:
      - dev

jobs:
  create_pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for existing PR
        id: check-pr
        run: |
          PR_NUMBER=$(gh pr list --base main --head dev --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            echo "pr_exists=true" >> $GITHUB_ENV
            echo "pr_number=$PR_NUMBER" >> $GITHUB_ENV
          else
            echo "pr_exists=false" >> $GITHUB_ENV
          fi
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: create pull request
        if: env.pr_exists == 'false'
        run: |
          PR_OUTPUT=$(gh pr create --base main --head dev --title "Merge dev into main" --body "Auto-generated PR to merge changes from dev to main.")
          PR_NUMBER=$(echo "$PR_OUTPUT" | grep -oP '(?<=#)\d+')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Logging
        run: |
          if [ "${{ env.pr_exists }}" = "true" ]; then
            echo "Existing PR Number: ${{ env.pr_number }}"
          else
            echo "New PR Number: ${{ env.pr_number }}"
          fi
      
      - name: Merge Pull Request
        id: merge-pr
        run: |
          if gh pr merge ${{ env.pr_number }} --merge --delete-branch; then
            echo "Pull request #${{ env.pr_number }} merged successfully."
          else
            echo "Failed to merge pull request #${{ env.pr_number }}."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}